<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>게임장</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --line: #334155;
            --text: #e2e8f0; --muted: #94a3b8; --accent: #f59e0b; --ok: #22c55e; --bad: #ef4444;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text);
        }
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; border-bottom: 1px solid var(--line);
        }
        header h1 { margin: 0; font-size: 20px; cursor: pointer; }
        .points { font-weight: 700; color: var(--accent); }
        .points button { margin-left: 8px; font-size: 12px; padding: 4px 8px; }
        .score {
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
            padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card);
            position: sticky; top: 0; z-index: 10;
        }
        .score .item { font-size: 13px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; }
        .score .item.cur { border-color: var(--accent); }
        .score .net { font-weight: 700; }
        main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
        .tile {
            background: var(--card); border: 1px solid var(--line); border-radius: 12px;
            padding: 28px 12px; text-align: center; cursor: pointer; transition: transform .1s, border-color .1s;
        }
        .tile:hover { transform: translateY(-3px); border-color: var(--accent); }
        .tile .icon { font-size: 44px; }
        .tile .name { margin-top: 8px; font-weight: 700; }
        .tile .desc { margin-top: 4px; font-size: 12px; color: var(--muted); }
        .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
        .panel h2 { margin: 0 0 16px; }
        button {
            background: var(--accent); color: #111; border: 0; border-radius: 8px;
            padding: 10px 16px; font-weight: 700; cursor: pointer; font-size: 14px;
        }
        button:disabled { opacity: .4; cursor: default; }
        button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
        button.sel { outline: 3px solid var(--ok); }
        .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0; }
        input[type=number] {
            width: 90px; padding: 8px; border-radius: 8px; border: 1px solid var(--line);
            background: var(--bg); color: var(--text);
        }
        .result { margin-top: 14px; min-height: 24px; font-weight: 700; font-size: 16px; }
        .win { color: var(--ok); } .lose { color: var(--bad); }
        .back { margin-bottom: 12px; }
        /* 경마 */
        .track { position: relative; height: 34px; border-bottom: 1px dashed var(--line); margin: 6px 0; }
        .horse { position: absolute; left: 0; top: 2px; font-size: 26px; transition: left .12s linear; transform: scaleX(-1); }
        .track .lane { position: absolute; right: 0; top: 8px; font-size: 12px; color: var(--muted); }
        .finish { position: absolute; right: 36px; top: 0; bottom: 0; border-right: 3px double var(--muted); }
        /* 사다리 */
        #ladder { display: block; margin: 0 auto; max-width: 100%; background: var(--bg); border-radius: 8px; }
        /* 홀짝 / 가위바위보 */
        .big { font-size: 64px; text-align: center; margin: 16px 0; }
    </style>
</head>
<body>
<header>
    <h1 id="home">🎰 게임장</h1>
    <div class="points">포인트 <span id="pts">1000</span>
        <button class="ghost" id="reset">초기화</button>
    </div>
</header>
<section class="score" id="score"></section>
<main id="app"></main>

<script>
    // ---- 공통 ----
    const app = document.getElementById('app');
    const START = 1000;
    let points = Number(localStorage.getItem('points') || START);
    if (!(points > 0)) points = START;

    const $ = (s, r = document) => r.querySelector(s);
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const rnd = n => Math.floor(Math.random() * n);

    function setPoints(v) {
        points = v;
        localStorage.setItem('points', v);
        $('#pts').textContent = v;
    }
    setPoints(points);

    // 게임별 누적 전적: { horse: {w, l, d, net}, ... }
    let stats = {};
    try { stats = JSON.parse(localStorage.getItem('stats') || '{}'); } catch (e) { stats = {}; }
    let current = null;
    function record(game, outcome, delta) {
        const s = stats[game] || (stats[game] = {w: 0, l: 0, d: 0, net: 0});
        s[outcome]++;
        s.net += delta;
        localStorage.setItem('stats', JSON.stringify(stats));
        renderScore();
    }
    function renderScore() {
        $('#score').innerHTML = Object.entries(games).map(([k, g]) => {
            const s = stats[k] || {w: 0, l: 0, d: 0, net: 0};
            const cls = s.net > 0 ? 'win' : s.net < 0 ? 'lose' : '';
            return `<span class="item ${k === current ? 'cur' : ''}">${g.icon} ${g.name} ` +
                `${s.w}승 ${s.l}패${k === 'rps' ? ` ${s.d}무` : ''} ` +
                `<span class="net ${cls}">${s.net > 0 ? '+' : ''}${s.net}P</span></span>`;
        }).join('');
    }
    $('#reset').onclick = () => { setPoints(START); stats = {}; localStorage.removeItem('stats'); renderScore(); };
    $('#home').onclick = () => show('lobby');

    // 베팅 UI: 금액 입력 + 검증. 유효하면 금액, 아니면 null
    const betHtml = `<label>베팅 <input type="number" id="bet" min="10" step="10" value="100"> P</label>`;
    function getBet(resultEl) {
        const b = Number($('#bet').value);
        if (!Number.isInteger(b) || b < 10) { resultEl.textContent = '베팅은 10P 이상 정수로 입력하세요.'; resultEl.className = 'result lose'; return null; }
        if (b > points) { resultEl.textContent = '포인트가 부족합니다.'; resultEl.className = 'result lose'; return null; }
        return b;
    }
    function settle(resultEl, win, bet, msg) {
        setPoints(points + (win ? bet : -bet));
        record(current, win ? 'w' : 'l', win ? bet : -bet);
        resultEl.className = 'result ' + (win ? 'win' : 'lose');
        resultEl.textContent = `${msg} ${win ? '+' : '-'}${bet}P`;
    }

    const games = {
        horse:  { icon: '🏇', name: '경마',       desc: '말을 골라 1등 맞히기 (x3)' },
        ladder: { icon: '🪜', name: '사다리타기', desc: '도착 지점 맞히기 (x3)' },
        oddeven:{ icon: '🎲', name: '홀짝',       desc: '주사위 합이 홀? 짝? (x1)' },
        rps:    { icon: '✌️', name: '가위바위보', desc: '컴퓨터를 이겨라 (x1)' },
    };

    function show(name) {
        current = name === 'lobby' ? null : name;
        renderScore();
        app.innerHTML = '';
        (name === 'lobby' ? lobby : views[name])();
    }

    function lobby() {
        app.innerHTML = `<div class="grid">${Object.entries(games).map(([k, g]) => `
            <div class="tile" data-g="${k}">
                <div class="icon">${g.icon}</div><div class="name">${g.name}</div><div class="desc">${g.desc}</div>
            </div>`).join('')}</div>
            <p style="color:var(--muted);text-align:center;margin-top:24px">가상 포인트로만 즐기는 게임입니다.</p>`;
        app.querySelectorAll('.tile').forEach(t => t.onclick = () => show(t.dataset.g));
    }

    function panel(name, body) {
        const g = games[name];
        app.innerHTML = `<button class="ghost back" id="toLobby">← 게임장</button>
            <div class="panel"><h2>${g.icon} ${g.name}</h2>${body}</div>`;
        $('#toLobby').onclick = () => show('lobby');
    }

    const views = {
        // ---- 경마 ----
        async horse() {
            const N = 5;
            panel('horse', `
                <div class="row" id="picks">${Array.from({length: N}, (_, i) =>
                    `<button class="ghost" data-i="${i}">${i + 1}번 말</button>`).join('')}</div>
                <div class="row">${betHtml}<button id="go" disabled>출발!</button></div>
                <div id="tracks">${Array.from({length: N}, (_, i) =>
                    `<div class="track"><span class="horse">🐎</span><span class="lane">${i + 1}</span><span class="finish"></span></div>`).join('')}</div>
                <div class="result" id="res">말을 선택하고 베팅하세요.</div>`);
            let pick = null, running = false;
            const res = $('#res'), go = $('#go');
            $('#picks').onclick = e => {
                const b = e.target.closest('button'); if (!b || running) return;
                pick = Number(b.dataset.i);
                document.querySelectorAll('#picks button').forEach(x => x.classList.toggle('sel', x === b));
                go.disabled = false;
            };
            go.onclick = async () => {
                const bet = getBet(res); if (bet === null) return;
                running = true; go.disabled = true;
                const horses = document.querySelectorAll('.horse');
                const width = $('#tracks').clientWidth - 70;
                const pos = Array(N).fill(0);
                let winner = -1;
                while (winner < 0) {
                    for (let i = 0; i < N; i++) {
                        pos[i] += Math.random() * 14;
                        horses[i].style.left = Math.min(pos[i], width) + 'px';
                        if (pos[i] >= width && winner < 0) winner = i;
                    }
                    await sleep(100);
                }
                // 동시 도착 시 가장 앞선 말
                winner = pos.indexOf(Math.max(...pos));
                const win = winner === pick;
                settle(res, win, win ? bet * 2 : bet, `${winner + 1}번 말 우승!`);
                running = false; go.disabled = false;
                horses.forEach(h => h.style.left = '0px');
            };
        },

        // ---- 사다리타기 ----
        ladder() {
            const N = 4, ROWS = 10, W = 440, H = 300, PAD = 40;
            panel('ladder', `
                <div class="row" id="picks">${Array.from({length: N}, (_, i) =>
                    `<button class="ghost" data-i="${i}">${i + 1}번 출발</button>`).join('')}
                    <span style="color:var(--muted)">→ 당첨 지점은 숨겨져 있습니다</span></div>
                <div class="row">${betHtml}<button id="go" disabled>타기!</button></div>
                <canvas id="ladder" width="${W}" height="${H}"></canvas>
                <div class="result" id="res">출발점을 선택하세요.</div>`);
            const cv = $('#ladder'), ctx = cv.getContext('2d');
            const res = $('#res'), go = $('#go');
            const colX = i => PAD + i * ((W - PAD * 2) / (N - 1));
            const rowY = r => 30 + r * ((H - 70) / (ROWS - 1));
            let pick = null;

            function makeBridges() {
                const br = [];
                for (let r = 0; r < ROWS; r++) {
                    const used = new Set();
                    for (let c = 0; c < N - 1; c++)
                        if (!used.has(c - 1) && Math.random() < 0.45) { br.push([r, c]); used.add(c); }
                }
                return br;
            }
            function draw(br, path, labels) {
                ctx.clearRect(0, 0, W, H);
                ctx.lineWidth = 3; ctx.strokeStyle = '#475569';
                for (let i = 0; i < N; i++) { ctx.beginPath(); ctx.moveTo(colX(i), 30); ctx.lineTo(colX(i), H - 40); ctx.stroke(); }
                br.forEach(([r, c]) => { ctx.beginPath(); ctx.moveTo(colX(c), rowY(r)); ctx.lineTo(colX(c + 1), rowY(r)); ctx.stroke(); });
                ctx.fillStyle = '#e2e8f0'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
                for (let i = 0; i < N; i++) {
                    ctx.fillText(i + 1, colX(i), 18);
                    if (labels) ctx.fillText(labels[i], colX(i), H - 18);
                }
                if (path) {
                    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 5; ctx.beginPath();
                    path.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
                }
            }
            draw([], null, null);
            $('#picks').onclick = e => {
                const b = e.target.closest('button'); if (!b) return;
                pick = Number(b.dataset.i);
                document.querySelectorAll('#picks button').forEach(x => x.classList.toggle('sel', x === b));
                go.disabled = false;
            };
            go.onclick = async () => {
                const bet = getBet(res); if (bet === null) return;
                go.disabled = true;
                const br = makeBridges();
                const prize = rnd(N); // 당첨 지점
                const labels = Array.from({length: N}, (_, i) => i === prize ? '🎯' : '꽝');
                let c = pick;
                const path = [[colX(c), 30]];
                for (let r = 0; r < ROWS; r++) {
                    const y = rowY(r);
                    const right = br.some(([rr, cc]) => rr === r && cc === c);
                    const left = br.some(([rr, cc]) => rr === r && cc === c - 1);
                    path.push([colX(c), y]);
                    if (right) { c++; path.push([colX(c), y]); }
                    else if (left) { c--; path.push([colX(c), y]); }
                    draw(br, path, null);
                    await sleep(160);
                }
                path.push([colX(c), H - 40]);
                draw(br, path, labels);
                const win = c === prize;
                settle(res, win, win ? bet * 2 : bet, win ? '당첨! 🎯' : '꽝!');
                go.disabled = false;
            };
        },

        // ---- 홀짝 ----
        oddeven() {
            panel('oddeven', `
                <div class="big" id="dice">🎲 🎲</div>
                <div class="row" style="justify-content:center">
                    <button class="ghost" data-c="odd">홀</button>
                    <button class="ghost" data-c="even">짝</button>
                </div>
                <div class="row" style="justify-content:center">${betHtml}</div>
                <div class="result" id="res" style="text-align:center">홀 또는 짝을 선택하면 바로 굴립니다.</div>`);
            const res = $('#res'), dice = $('#dice');
            const faces = ['', '⚀', '⚁', '⚂', '⚃', '⚄', '⚅'];
            document.querySelectorAll('[data-c]').forEach(b => b.onclick = async () => {
                const bet = getBet(res); if (bet === null) return;
                document.querySelectorAll('[data-c]').forEach(x => x.disabled = true);
                for (let i = 0; i < 8; i++) { dice.textContent = `${faces[1 + rnd(6)]} ${faces[1 + rnd(6)]}`; await sleep(90); }
                const a = 1 + rnd(6), c = 1 + rnd(6), sum = a + c;
                dice.textContent = `${faces[a]} ${faces[c]}`;
                const result = sum % 2 ? 'odd' : 'even';
                settle(res, result === b.dataset.c, bet, `합 ${sum} → ${sum % 2 ? '홀' : '짝'}.`);
                document.querySelectorAll('[data-c]').forEach(x => x.disabled = false);
            });
        },

        // ---- 가위바위보 ----
        rps() {
            const hands = ['✌️', '✊', '🖐️']; // 0 가위, 1 바위, 2 보
            const names = ['가위', '바위', '보'];
            panel('rps', `
                <div class="big" id="vs">❓ vs ❓</div>
                <div class="row" style="justify-content:center">${hands.map((h, i) =>
                    `<button class="ghost" data-h="${i}">${h} ${names[i]}</button>`).join('')}</div>
                <div class="row" style="justify-content:center">${betHtml}</div>
                <div class="result" id="res" style="text-align:center">무승부는 포인트 변동이 없습니다.</div>`);
            const res = $('#res');
            document.querySelectorAll('[data-h]').forEach(b => b.onclick = async () => {
                const bet = getBet(res); if (bet === null) return;
                document.querySelectorAll('[data-h]').forEach(x => x.disabled = true);
                const me = Number(b.dataset.h);
                for (let i = 0; i < 6; i++) { $('#vs').textContent = `${hands[me]} vs ${hands[rnd(3)]}`; await sleep(100); }
                const cpu = rnd(3);
                $('#vs').textContent = `${hands[me]} vs ${hands[cpu]}`;
                const diff = (me - cpu + 3) % 3; // 0 무, 1 승, 2 패
                if (diff === 0) { res.className = 'result'; res.textContent = '비겼습니다.'; record('rps', 'd', 0); }
                else settle(res, diff === 1, bet, diff === 1 ? '이겼습니다!' : '졌습니다.');
                document.querySelectorAll('[data-h]').forEach(x => x.disabled = false);
            });
        },
    };

    show('lobby');
</script>
</body>
</html>
